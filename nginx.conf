server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip para o unico arquivo pesado que existe aqui (o HTML/CSS inline)
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # pagina unica, sem hash no nome do arquivo: cache curto,
        # sempre revalidando, para uma atualizacao aparecer na hora
        add_header Cache-Control "no-cache";
        # nginx nao herda add_header do bloco server quando o location
        # tambem declara o seu (add_header some, nao acumula) -- por isso
        # os headers de seguranca ficam repetidos aqui, na location real
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    }

    # CSS/JS do Astro têm hash no nome: podem ficar em cache para sempre
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:svg|ico|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
